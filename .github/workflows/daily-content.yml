name: Daily content (AI)

on:
  schedule:
    - cron: '7 1 * * *'   # roz ~02:07 / 03:07 Uhr deutsche Zeit
  workflow_dispatch:
    inputs:
      ahead:
        description: 'Kitne din aage tak quotes (1 = kal)'
        default: '1'
      seed_photos:
        description: 'Saari photo themes ek saath (pehli baar)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-content

jobs:
  content:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Content branch (archive) laao
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO" content >/dev/null; then
            git clone -q --depth 1 --branch content "$REPO" content
          else
            mkdir content && cd content && git init -q -b content && git remote add origin "$REPO"
          fi

      - run: pip install pillow

      - name: AI se quotes, mausam quotes aur photos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: |
          set -o pipefail
          mkdir -p content/logs
          python3 -u content_pipeline/generate.py --root content \
            --ahead "${{ github.event.inputs.ahead || '1' }}" \
            ${{ github.event.inputs.seed_photos == 'true' && '--seed-photos' || '' }} 2>&1 | tee content/logs/last_run.txt

      - name: FTP host check
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          H="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$##')"
          {
            echo "secret_len=${#FTP_SERVER} cleaned_len=${#H} cleaned_resolves=$(getent hosts "$H" >/dev/null && echo yes || echo no)"
            for c in ftp.cameraclickz.com cameraclickz.com ftp.moezzadigital.com moezzadigital.com zitatecke.moezzadigital.com; do
              echo "$c: $(getent hosts $c | awk '{print $1}' | head -1)"
            done
          } | tee content/logs/ftp_check.txt
          if ! getent hosts "$H" >/dev/null; then
            for c in ftp.cameraclickz.com cameraclickz.com ftp.moezzadigital.com zitatecke.moezzadigital.com; do
              if getent hosts "$c" >/dev/null; then H="$c"; break; fi
            done
          fi
          echo "using=$H" | tee -a content/logs/ftp_check.txt
          echo "FTP_HOST=$H" >> "$GITHUB_ENV"

      - name: Archive save karo (content branch)
        run: |
          cd content
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Content $(date -u +%F)" || echo "no changes"
          git push -q origin content

      - name: zitatecke.moezzadigital.com pe upload (FTP)
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./content/site/
          server-dir: ${{ secrets.FTP_DIR || './' }}
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
