name: Store screenshots
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: APK laao
        run: |
          git clone -q --depth 1 -b apk "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/apk
          cp /tmp/apk/zitatecke.apk app.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        timeout-minutes: 25
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          script: bash tool/store_shots.sh
      - name: Save to 'shots' branch
        if: always()
        run: |
          cd /tmp/shots || exit 0
          git init -q -b shots
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm "shots ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots
