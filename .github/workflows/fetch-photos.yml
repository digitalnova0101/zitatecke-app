name: Fetch photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tool/fetch_photos.py']

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tool/fetch_photos.py /tmp/photos
      - name: Candidates 'photos' branch pe save karo
        run: |
          cd /tmp/photos
          git init -q -b photos
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Photo candidates"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" photos
