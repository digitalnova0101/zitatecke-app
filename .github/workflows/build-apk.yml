name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['tool/fetch_photos.py', '.github/workflows/fetch-photos.yml', 'content_pipeline/**', '.github/workflows/daily-content.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android project banao
        run: flutter create --project-name guten_morgen_app --org de.zitatecke --platforms android .

      - name: Packages
        run: flutter pub get && grep -A4 -E 'shared_preferences_android|path_provider_android|^  jni:' pubspec.lock

      - name: Notifications + package ID setup
        run: dart run tool/setup_android.dart

      - name: Tests (code check)
        run: flutter test

      - name: App icon + splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: APK build
        run: flutter build apk --release && grep -nE "Minify|Shrink|release" android/app/build.gradle* || true

      - name: APK download ke liye upload
        uses: actions/upload-artifact@v4
        with:
          name: zitatecke-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: APK ko 'apk' branch pe save karo
        run: |
          mkdir -p /tmp/out
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/out/zitatecke.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zitatecke.apk
          git commit -qm "APK build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Emulator ke liye KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator mein app chala ke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/emulator_test.sh

      - name: Test result 'debug' branch pe save karo
        if: always()
        run: |
          mkdir -p /tmp/dbg && cp -r /tmp/emu/. /tmp/dbg/ 2>/dev/null || true
          cd /tmp/dbg
          git init -q -b debug
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Emulator test ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug
