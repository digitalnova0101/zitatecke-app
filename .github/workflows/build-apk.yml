name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android project banao
        run: flutter create --project-name guten_morgen_app --org de.zitatecke --platforms android .

      - name: Packages
        run: flutter pub get

      - name: Notifications + package ID setup
        run: dart run tool/setup_android.dart

      - name: APK build
        run: flutter build apk --release

      - name: APK download ke liye upload
        uses: actions/upload-artifact@v4
        with:
          name: zitatecke-apk
          path: build/app/outputs/flutter-apk/app-release.apk
