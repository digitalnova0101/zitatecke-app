name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['tool/store_shots.sh', '.github/workflows/store-shots.yml', 'tool/fetch_photos.py', '.github/workflows/fetch-photos.yml', 'content_pipeline/**', '.github/workflows/daily-content.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android project banao
        run: flutter create --project-name guten_morgen_app --org de.zitatecke --platforms android .

      - name: Packages
        run: flutter pub get && grep -A4 -E 'shared_preferences_android|path_provider_android|^  jni:' pubspec.lock

      - name: Upload key (Play Store signing)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ZT_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "upload key ✓"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret nahi hai – debug signing"
          fi

      - name: Notifications + package ID + signing setup
        env:
          ZT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: dart run tool/setup_android.dart

      - name: Tests (code check)
        run: flutter test

      - name: App icon + splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: APK + AAB build
        env:
          ZT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
          ls -la build/app/outputs/bundle/release/

      - name: APK download ke liye upload
        uses: actions/upload-artifact@v4
        with:
          name: zitatecke-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: APK ko 'apk' branch pe save karo
        run: |
          mkdir -p /tmp/out
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/out/zitatecke.apk
          cp build/app/outputs/bundle/release/app-release.aab /tmp/out/zitatecke.aab
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zitatecke.apk zitatecke.aab
          git commit -qm "APK build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
