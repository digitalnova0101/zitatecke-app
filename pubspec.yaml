name: guten_morgen_app
description: "Zitatecke: Sprüche & Grüße – Guten Morgen, Gute Nacht und Motivation."
publish_to: 'none'
version: 1.6.2+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  share_plus: ^11.0.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/quotes.json
    - assets/weather_quotes.json
    - assets/brand/
    - assets/backgrounds/
    - assets/illustrations/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-MediumItalic.ttf
          weight: 500
          style: italic
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-SemiBold.ttf
          weight: 600
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf

# App icon:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "assets/brand/icon_background.png"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21

# Splash screen:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFF8F1"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#FFF8F1"
    image: assets/brand/splash_android12.png
  ios: false
  web: false
